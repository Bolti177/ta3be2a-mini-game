<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعبئة الكرش</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">لعبة الكرش</h1>
        
        <div class="message" id="message">اضغط علي الكرش</div>
        
        <div class="belly-container">
            <img src="image.png" alt="Filled Belly" id="filledImage" class="filled-image" style="display: none;">
            <svg class="belly" id="belly" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
                <!-- Belly shape -->
                <ellipse cx="150" cy="175" rx="140" ry="160" fill="#FFD4A3" stroke="#E6A86D" stroke-width="4"/>
                
                <!-- Belly button -->
                <circle cx="150" cy="190" r="12" fill="#D4956F" opacity="0.7"/>
                <circle cx="150" cy="190" r="6" fill="#B8845D" opacity="0.5"/>
                
                <!-- Shine effect -->
                <ellipse cx="120" cy="120" rx="50" ry="40" fill="white" opacity="0.3"/>
                <ellipse cx="140" cy="110" rx="30" ry="25" fill="white" opacity="0.4"/>
                
                <!-- Food items (hidden by default, shown when filled) -->
                <g id="foodItems" style="opacity: 0;">
                    <!-- Pizza slice -->
                    <path d="M 80 100 L 110 130 L 95 145 Z" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
                    <circle cx="90" cy="120" r="3" fill="#FF6347"/>
                    <circle cx="100" cy="130" r="3" fill="#FF6347"/>
                    
                    <!-- Burger -->
                    <ellipse cx="180" cy="140" rx="20" ry="15" fill="#D2691E"/>
                    <rect x="160" y="145" width="40" height="8" fill="#228B22" rx="2"/>
                    <rect x="165" y="153" width="30" height="10" fill="#8B4513" rx="3"/>
                    
                    <!-- Chicken leg -->
                    <ellipse cx="130" cy="220" rx="15" ry="20" fill="#CD853F"/>
                    <rect x="125" y="235" width="10" height="15" fill="#F5DEB3" rx="2"/>
                    
                    <!-- Donut -->
                    <circle cx="200" cy="210" r="18" fill="#FF69B4" stroke="#FF1493" stroke-width="2"/>
                    <circle cx="200" cy="210" r="8" fill="#FFE4E1"/>
                    <circle cx="193" cy="205" r="2" fill="#FF6347"/>
                    <circle cx="207" cy="208" r="2" fill="#4169E1"/>
                    <circle cx="198" cy="218" r="2" fill="#FFD700"/>
                </g>
            </svg>
        </div>
        
        <div class="counter" id="counter">Presses: 0</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
